name: UI screenshots

# Renders every screen (phone upright, phone on its side, tablet) on the JVM with Robolectric and
# publishes the pictures to the orphan branch "ui-shots-results". Runs on the branch "ui-shots"
# (screen work in progress; never released) or by hand.
on:
  push:
    branches: [ "ui-shots" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Title font (Thmanyah, decrypted only with the repository secret)
        env:
          THMANYAH_FONT_KEY: ${{ secrets.THMANYAH_FONT_KEY }}
        run: bash tools/fonts.sh

      - name: Render the screens, test the liquid glass
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.abdulrahman.hardsubocr.ui.*" 2>&1 | tee shots.log

      - name: Publish (branch ui-shots-results)
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/shots/*.png /tmp/out/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|Exception|Caused by|What went wrong" -A3 shots.log | head -300 > /tmp/out/errors.txt || true
          tail -120 shots.log > /tmp/out/tail.txt || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && cp "$f" /tmp/out/; done
          git config user.name "ui-shots"
          git config user.email "ui-shots@users.noreply.github.com"
          git worktree add --detach /tmp/r
          cd /tmp/r && git checkout --orphan ui-shots-results && git rm -rfq . && cp -r /tmp/out/* . 2>/dev/null || true
          echo "${GITHUB_SHA}" > commit.txt
          git add -A && git commit -qm "shots ${GITHUB_SHA}" && git push -qf origin HEAD:ui-shots-results
