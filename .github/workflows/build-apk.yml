name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works even if the zip was uploaded through the GitHub website
      # (the web upload does not keep the executable bit of gradlew).
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          HSOCR_STORE_PASSWORD: ${{ secrets.HSOCR_STORE_PASSWORD }}
          HSOCR_KEY_ALIAS: ${{ secrets.HSOCR_KEY_ALIAS }}
          HSOCR_KEY_PASSWORD: ${{ secrets.HSOCR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HardSubOCR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (R8 optimized, smaller & faster)
        id: release
        continue-on-error: true
        env:
          HSOCR_STORE_PASSWORD: ${{ secrets.HSOCR_STORE_PASSWORD }}
          HSOCR_KEY_ALIAS: ${{ secrets.HSOCR_KEY_ALIAS }}
          HSOCR_KEY_PASSWORD: ${{ secrets.HSOCR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HardSubOCR-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Direct phone-friendly download: https://github.com/<you>/<repo>/releases/latest
      - name: Publish APK as a GitHub Release
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk HardSubOCR.apk
          gh release create "build-${{ github.run_number }}" HardSubOCR.apk \
            --title "HardSub OCR — build ${{ github.run_number }}" \
            --notes "نسخة أندرويد تلقائية من الفرع ${{ github.ref_name }} (commit ${{ github.sha }}). حمّل HardSubOCR.apk وثبّته." \
            --target "${{ github.sha }}" --latest
